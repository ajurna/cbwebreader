upstream cbwebreader_django {
    server cbwebreader:8000;
}

server {

    listen 80;

    # nginx compresses only text/html by default, so the bundle and CSS need explicit types.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_vary on;

    location / {
        proxy_pass http://cbwebreader_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /static/;
    }
    location /media/ {
        alias /media/;
    }

}
