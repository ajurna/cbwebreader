name: Build and push image

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Docker
        run: curl -fsSL https://get.docker.com | sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      # Extract version from the project metadata
      - name: Get version
        run: echo "PROJECT_VERSION=$(uv version --short)" >> $GITHUB_ENV
      - name: Build and push Docker image
        run: |
          docker build -t ajurna/cbwebreader:latest -t ajurna/cbwebreader:${{ env.PROJECT_VERSION }} .
          docker push ajurna/cbwebreader:${{ env.PROJECT_VERSION }}
          docker push ajurna/cbwebreader:latest
