[project]
name = "cbwebreader"
version = "1.1.12"
description = "CBR/Z Web Reader"
readme = "README.md"
requires-python = ">=3.14"
authors = ["ajurna <ajurna@gmail.com>"]
license = "Creative Commons Attribution-ShareAlike 4.0 International License"

dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-boost>=2.2",
    "django-bootstrap4>=26.3",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-imagekit>=6.1.1",
    "django-permissions-policy>=4.34.0",
    "django-silk>=5.6.0",
    "django-sri>=1.0.0",
    "django-webpack-loader>=3.2.4",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-extensions>=0.7.1",
    "drf-yasg>=1.21.18",
    "gunicorn>=26.2.0",
    "loguru>=0.7.3",
    "mysqlclient>=2.3.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rarfile>=4.5",
    "setuptools>=84.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "flake8>=7.3.0",
    "flake8-annotations>=3.2.0",
    "ipython>=9.13.0",
    "mypy>=2",
    "pre-commit>=4.6",
    "pylint>=4.0.5",
    "pylint-django>=2.7.0",
    "pyopenssl>=26.2.0",
    "werkzeug>=3.1.8",
]
